[package]
name = "agent_router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
arc-swap = "1.9.1"
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
prometheus-parse = "0.2"
redis = { version = "0.27.6", features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "sync", "time"] }
